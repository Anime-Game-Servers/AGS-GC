buildscript {
    repositories {
        maven { url "https://plugins.gradle.org/m2/" }
    }
}

plugins {
    // Apply the application plugin to add support for building a CLI application
    id 'application'

    // Apply the java plugin to add support for Java
    id 'java'

    id 'com.gradleup.shadow' version '9.6.1'
}

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"


group = 'xyz.grasscutters'
version = '0.5-dev'


java {
    withJavadocJar()
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "ags-mvn-Releases"
        url = uri("https://mvn.animegameservers.org/releases")
    }
    maven {
        name = "ags-mvn-Snapshots"
        url = uri("https://mvn.animegameservers.org/snapshots")
    }
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])

    implementation "it.unimi.dsi:fastutil:8.5.8"

    implementation "org.slf4j:slf4j-api:1.7.36"
    implementation "ch.qos.logback:logback-core:1.5.8"
    implementation "ch.qos.logback:logback-classic:1.5.8"

    implementation "org.jline:jline:3.21.0"
    implementation "org.jline:jline-terminal-jna:3.21.0"
    implementation "net.java.dev.jna:jna:5.10.0"

    implementation "io.netty:netty-common:4.1.79.Final"
    implementation "io.netty:netty-handler:4.1.79.Final"
    implementation "io.netty:netty-transport-native-epoll:4.1.79.Final"
    implementation "io.netty:netty-transport-native-kqueue:4.1.79.Final"

    implementation "com.google.code.gson:gson:2.9.0"

    implementation "org.reflections:reflections:0.10.2"

    implementation "dev.morphia.morphia:morphia-core:2.3.8"

    implementation "org.greenrobot:eventbus-java:3.3.1"
    //implementation group: 'org.danilopianini', name: 'java-quadtree', version: '0.1.9'

    implementation "org.quartz-scheduler:quartz:2.3.2"
    implementation "org.quartz-scheduler:quartz-jobs:2.3.2"
    implementation 'org.apache.commons:commons-lang3:3.14.0'

    implementation("org.anime_game_servers.core:gi:0.1")
    implementation("org.anime_game_servers:luaj:3.0.3")
    implementation("org.anime_game_servers:JNLua_GC:0.1.0")
    implementation("org.anime_game_servers.lua:base:0.2")
    implementation("org.anime_game_servers.lua:GIlua:0.2")
    implementation("org.anime_game_servers.lua:LuaJEngine:0.2")
    implementation("org.anime_game_servers.lua:JNLuaEngine:0.2")

    implementation("org.anime_game_servers:grasskcpper:0.1")
    implementation("org.anime_game_servers.multi_proto:gi-jvm:0.2.32")

    implementation("org.anime_game_servers.data_models:GIData:0.2")
    implementation("org.anime_game_servers.data_models:loader-jvm:0.2")

    implementation "com.esotericsoftware:reflectasm:1.11.9"
    implementation "com.github.davidmoten:rtree-multi:0.1"

    implementation group:  'com.esotericsoftware', name : 'reflectasm', version: '1.11.9'
    implementation group:  'com.github.davidmoten', name : 'rtree-multi', version: '0.1'

    implementation "io.javalin:javalin:4.6.4"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.13.3"

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
}

configurations.all {
    exclude group: 'org.slf4j', module: 'slf4j'
}

application {
    // Define the main class for the application
    getMainClass().set('emu.grasscutter.Grasscutter')
}

shadowJar {
    zip64 = true
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()

    archiveBaseName = 'grasscutter'
    if (project.hasProperty('jarFilename')) {
        archiveFileName = "${jarFilename}.${extension}"
    }

    destinationDirectory = file(".")
}

sourceSets {
    main {
        java {
            srcDir 'src/java'
        }
    }
}

javadoc {
    options.encoding = 'UTF-8'
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

task injectGitHash {
    def gitCommitHash = {
        try {
            return 'git rev-parse --verify --short HEAD'.execute().text.trim()
        } catch (ignored) {
            return "GIT_NOT_FOUND"
        }
    }

    new File(projectDir, "src/main/java/emu/grasscutter/BuildConfig.java").text =
        """package emu.grasscutter;

public final class BuildConfig {
    public static final String VERSION = \"${version}\";
    public static final String GIT_HASH = \"${gitCommitHash()}\";
}"""

}

// For terminal interacting in IDEA running
run {
    standardInput = System.in
}
